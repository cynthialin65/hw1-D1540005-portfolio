Let's weigh the pros and cons.|我們來權衡利弊吧。|pros and cons|phr.|優缺點|weigh 權衡。
Don't let fear hold you back.|別讓恐懼阻礙你。|hold back|phr.|阻礙|hold someone back。
His dedication to the team is admirable.|他對團隊的奉獻令人欽佩。|dedication|n.|奉獻|admirable 令人欽佩的。
She managed to balance school and sports.|她設法兼顧課業和運動。|balance|v.|平衡|manage to V＝設法做到。
Volunteers cleaned up the beach after the storm.|暴風雨過後，志工們清理了海灘。|clean up|phr.|清理|after the storm 暴風雨後。
The survey revealed some surprising results.|調查揭露了一些令人驚訝的結果。|reveal|v.|揭露|survey 調查。
He is reluctant to admit his mistakes.|他不願承認錯誤。|admit|v.|承認|admit + V-ing／名詞。
Be open to new experiences.|要對新經驗保持開放。|open to|phr.|樂於接受|be open to + 名詞。
Learning never stops, even after school.|學習永不停止，即使畢業之後也是。|even|adv.|甚至|even after…＝即使在…之後。
The air quality is poor today, so stay indoors.|今天空氣品質不佳，請待在室內。|indoors|adv.|在室內|outdoors 在戶外。
Fireworks lit up the night sky.|煙火照亮了夜空。|light up|phr.|照亮|light → lit → lit。
Our ancestors faced challenges we can hardly imagine.|我們的祖先面對我們難以想像的挑戰。|ancestor|n.|祖先|hardly 幾乎不。
Respecting the elderly is an important value.|尊敬長輩是重要的價值觀。|elderly|n./adj.|老年人；年長的|the elderly＝老年人。
Every voice deserves to be heard.|每個聲音都值得被聽見。|deserve|v.|值得|deserve to be + p.p.。
The best way to predict the future is to create it.|預測未來最好的方法就是創造它。|predict|v.|預測|create 創造。
You don't have to be perfect to make progress.|你不需要完美也能進步。|progress|n.|進步|make progress＝進步。
Creativity flourishes when people feel safe.|人們感到安全時，創意才會蓬勃發展。|flourish|v.|蓬勃發展|when 引導時間子句。
Every expert was once a beginner.|每個專家都曾是初學者。|beginner|n.|初學者|once 曾經。
She has a knack for making people feel welcome.|她很有讓人感到受歡迎的本事。|knack|n.|本領|have a knack for + V-ing。
The policy sparked a nationwide debate.|這項政策引發全國性的辯論。|nationwide|adj.|全國性的|spark 引發。
Digital literacy is crucial in the modern world.|數位素養在現代社會至關重要。|literacy|n.|素養；識字能力|crucial 關鍵的。
Few things are as rewarding as helping others.|很少有事情比幫助別人更有成就感。|rewarding|adj.|有收穫的|Few things are as…as…。
His enthusiasm is contagious.|他的熱情很有感染力。|contagious|adj.|有感染力的|enthusiasm 熱情。
We must find a balance between growth and conservation.|我們必須在發展與保育之間找到平衡。|conservation|n.|保育|balance between A and B。
The evidence strongly suggests otherwise.|證據強烈顯示並非如此。|otherwise|adv.|不同地|suggest 暗示。
Persistence is what separates success from failure.|毅力是區分成功與失敗的關鍵。|separate|v.|區分|separate A from B。
The documentary sheds light on a forgotten history.|這部紀錄片揭示了一段被遺忘的歷史。|shed light on|phr.|闡明|慣用語。
Kindness is a language everyone understands.|善良是每個人都懂的語言。|language|n.|語言|everyone 用單數動詞。
She dealt with the crisis calmly and efficiently.|她冷靜又有效率地處理危機。|efficiently|adv.|有效率地|crisis 危機。
Ambition without action is just a dream.|有抱負卻不行動，只是一場夢。|ambition|n.|抱負|without 沒有。
He is widely regarded as a pioneer in robotics.|他被普遍視為機器人學的先驅。|pioneer|n.|先驅|be regarded as…。
Feedback is a gift, even when it's hard to hear.|回饋是一份禮物，即使它不好聽。|even when|phr.|即使當|even when + 子句。
Stay curious, stay humble, and keep learning.|保持好奇、保持謙虛、持續學習。|humble|adj.|謙虛的|祈使句排比。
</script>

<style>
  :root{
    --bg:#f2f5fb; --card:#ffffff; --text:#0b1f44; --muted:#4b5d7e;
    --line:#d5deee; --accent:#1e40af; --accent-soft:#dde6f6; --ok:#1d4ed8;
    --lv1:#3b6fd8; --lv2:#1e40af; --lv3:#0f2a5e;
    --gold:#94742a; --gold-fill:#c9a75e; --gold-soft:#f6efdf;
  }
  html[data-theme="dark"]{
    --bg:#071430; --card:#0e1f42; --text:#e6edf8; --muted:#9cb0d2;
    --line:#1d3566; --accent:#7fa7f5; --accent-soft:#17305f; --ok:#3b6fd8;
    --lv1:#4f7fe6; --lv2:#2f62d9; --lv3:#1e3a8a;
    --gold:#dcc28a; --gold-fill:#d4b673; --gold-soft:#2c2a24;
  }
  html.embed .title-block{display:none}
  html.embed header{justify-content:flex-start}
  html.embed .wrap{max-width:none;padding:4px 0 8px}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.6}
  .wrap{max-width:720px;margin:0 auto;padding:20px 16px}
  header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  h2{margin:0;font-size:1.35rem}
  .sub{color:var(--muted);font-size:.85rem}
  .levels{display:flex;gap:6px;flex-wrap:wrap}
  .levels button{border:1px solid var(--line);background:var(--card);color:var(--text);
    padding:6px 12px;border-radius:999px;cursor:pointer;font-size:.85rem}
  .levels button[aria-pressed="true"]{background:var(--lvc);border-color:var(--lvc);color:#fff}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px}
  .meta{display:flex;justify-content:space-between;align-items:center;font-size:.8rem;color:var(--muted);margin-bottom:10px}
  .tag{display:inline-block;padding:2px 10px;border-radius:999px;color:#fff;background:var(--lvc);font-size:.75rem}
  .en{font-size:1.45rem;font-weight:600;margin:6px 0 8px;font-family:Georgia,"Times New Roman",serif}
  .en mark{background:var(--accent-soft);color:var(--accent);padding:0 3px;border-radius:4px}
  .zh{color:var(--muted);transition:filter .2s}
  .zh.hidden{filter:blur(6px);user-select:none;cursor:pointer}
  .word{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);font-size:.92rem}
  .word b{color:var(--accent)}
  .tip{margin-top:6px;font-size:.88rem;color:var(--muted)}
  .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
  .btn{border:1px solid var(--line);background:var(--bg);color:var(--text);padding:8px 14px;
    border-radius:10px;cursor:pointer;font-size:.88rem}
  .btn:hover{border-color:var(--accent)}
  .btn.primary{background:var(--lv2);border-color:var(--lv2);color:#fff}
  .btn.done{background:var(--ok);border-color:var(--ok);color:#fff}
  .nav{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:.85rem;color:var(--muted)}
  .nav button{background:none;border:none;color:var(--accent);cursor:pointer;font-size:.85rem;padding:4px}
  .nav button:disabled{color:var(--muted);opacity:.5;cursor:default}
  .quiz{margin-top:16px;display:none}
  .quiz.show{display:block}
  .quiz p{margin:0 0 8px;font-size:.92rem}
  .opts{display:flex;gap:8px;flex-wrap:wrap}
  .opts button{border:1px solid var(--line);background:var(--bg);color:var(--text);padding:6px 12px;border-radius:8px;cursor:pointer}
  .opts button.right{background:var(--ok);color:#fff;border-color:var(--ok)}
  .opts button.wrong{text-decoration:line-through;opacity:.6}
  footer{margin-top:12px;font-size:.75rem;color:var(--muted);text-align:center}
  /* 香檳金點綴 */
  .card{border-top:3px solid var(--gold-fill)}
  .btn.primary{background:var(--gold-fill);border-color:var(--gold-fill);color:#0a1a3a;font-weight:600}
  .btn.done{background:var(--gold-fill);border-color:var(--gold-fill);color:#0a1a3a}
  .levels button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--gold-fill)}
  .word b{color:var(--gold)}
  .tip{border-left:3px solid var(--gold-fill);padding-left:10px}
  #streak{color:var(--gold);font-weight:600}
  .opts button.right{background:var(--gold-fill);border-color:var(--gold-fill);color:#0a1a3a}

  /* 時事短文 */
  .news{margin-top:18px}
  .news h3{margin:4px 0 0;font-size:1.15rem;font-family:Georgia,"Times New Roman",serif}
  .news .tz{color:var(--muted);font-size:.85rem;margin-bottom:10px}
  .tag.gold{background:var(--gold-fill);color:#0a1a3a}
  .s{padding:7px 10px;margin:2px -10px;border-radius:8px;cursor:pointer}
  .s:hover{background:var(--accent-soft)}
  .s.playing{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--gold-fill)}
  .se{font-size:1.02rem}
  .se::after{content:" 🔊";font-size:.75rem;opacity:.45}
  .sz{display:none;color:var(--muted);font-size:.88rem;margin-top:2px}
  .s.open .sz{display:block}
  .src{margin-top:10px;font-size:.75rem;color:var(--muted)}
  .src a{color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="title-block">
      <h2>每日一句英文 <span style="font-weight:400">Daily English</span></h2>
      <div class="sub">依全民英檢 GEPT 分級・每天一句、一個關鍵字、一題小測驗</div>
    </div>
    <div class="levels" role="group" aria-label="選擇程度">
      <button data-lv="1">初級 A2</button>
      <button data-lv="2">中級 B1</button>
      <button data-lv="3">中高級 B2</button>
    </div>
  </header>

  <div class="card">
    <div class="meta">
      <span id="date"></span>
      <span class="tag" id="lvTag"></span>
    </div>
    <div class="en" id="en"></div>
    <div class="zh hidden" id="zh" title="點一下顯示中文"></div>
    <div class="word" id="word"></div>
    <div class="tip" id="tip"></div>

    <div class="actions">
      <button class="btn primary" id="speak">🔊 聽發音</button>
      <button class="btn" id="slow">🐢 慢速</button>
      <button class="btn" id="toggleZh">顯示中文</button>
      <button class="btn" id="quizBtn">✏️ 小測驗</button>
      <button class="btn" id="doneBtn">✓ 今天學會了</button>
    </div>

    <div class="quiz" id="quiz">
      <p id="qText"></p>
      <div class="opts" id="opts"></div>
    </div>
  </div>

  <div class="nav">
    <button id="prev">← 前一天</button>
    <span id="streak"></span>
    <button id="next">後一天 →</button>
  </div>

  <div class="card news" id="news" hidden>
    <div class="meta"><span id="nDate"></span><span class="tag gold">時事短文 News</span></div>
    <h3 id="nTitle"></h3>
    <div class="tz" id="nTitleZh"></div>
    <div id="nBody"></div>
    <div class="actions">
      <button class="btn primary" id="nAll">▶ 全文朗讀</button>
      <button class="btn" id="nZh">顯示全部中文</button>
    </div>
    <div class="src" id="nSrc"></div>
  </div>
  <footer>👆 點短文任一句可重複聽發音並看中文。例句為原創教學用句。發音使用瀏覽器內建語音。</footer>
</div>

<script>
/* ===== 句庫：每級 30 句，依日期輪替 =====
   w: [關鍵字, 詞性, 中文]  t: 用法小提醒 */
const DATA = {};
[1,2,3].forEach(l=>{
  DATA[l] = document.getElementById("lv"+l).textContent.split("\n")
    .map(x=>x.trim()).filter(x=>x && !x.startsWith("<!--"))
    .map(x=>{const a=x.split("|"); return {e:a[0],z:a[1]||"",w:[a[2]||"",a[3]||"",a[4]||""],t:a[5]||""};});
});

const LV_NAME = {1:"GEPT 初級・CEFR A2",2:"GEPT 中級・CEFR B1",3:"GEPT 中高級・CEFR B2"};
const LV_COLOR = {1:"var(--lv1)",2:"var(--lv2)",3:"var(--lv3)"};
const $ = id => document.getElementById(id);

/* 安全的 localStorage（嵌入 iframe 時某些瀏覽器會擋） */
const store = {
  get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};

/* 網址參數：?level=2&theme=dark */
const params = new URLSearchParams(location.search);
if(params.get("embed")) document.documentElement.classList.add("embed");
let level = Number(params.get("level")) || store.get("de_level",1);
if(![1,2,3].includes(level)) level = 1;
let offset = 0; // 0 = 今天，-1 = 昨天…

function setTheme(t){
  if(t!=="dark" && t!=="light"){
    t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  }
  document.documentElement.dataset.theme = t;
}
setTheme(params.get("theme"));
/* 父頁面可用 postMessage 同步深色模式 */
window.addEventListener("message", e=>{
  if(e.data && e.data.type==="theme") setTheme(e.data.value);
});

function dayIndex(d){ // 從 2026-01-01 起算的天數
  const base = Date.UTC(2026,0,1);
  const t = Date.UTC(d.getFullYear(), d.getMonth(), d.getDate());
  return Math.floor((t-base)/86400000);
}
function todayDate(){ const d=new Date(); d.setDate(d.getDate()+offset); return d; }
function current(){
  const list = DATA[level];
  const i = ((dayIndex(todayDate()) % list.length) + list.length) % list.length;
  return list[i];
}
function key(){ const d=todayDate(); return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`; }

function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

function render(){
  const s = current(), d = todayDate();
  document.documentElement.style.setProperty("--lvc", LV_COLOR[level]);
  document.querySelectorAll(".levels button").forEach(b=>b.setAttribute("aria-pressed", Number(b.dataset.lv)===level));
  const wk = ["日","一","二","三","四","五","六"][d.getDay()];
  $("date").textContent = `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}（${wk}）${offset===0?"・今天":""}`;
  $("lvTag").textContent = LV_NAME[level];

  // 句子中標示關鍵字（找得到才標）
  const w = s.w[0];
  const re = new RegExp("\\b("+w.split(/\s+/)[0].replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\w*)","i");
  $("en").innerHTML = esc(s.e).replace(re,"<mark>$1</mark>");
  $("zh").textContent = s.z;
  $("zh").classList.add("hidden");
  $("toggleZh").textContent = "顯示中文";
  $("word").innerHTML = `📌 關鍵字：<b>${esc(w)}</b> <i>${esc(s.w[1])}</i> ${esc(s.w[2])}`;
  $("tip").textContent = "💡 " + s.t;
  $("quiz").classList.remove("show");
  $("next").disabled = offset >= 0;

  const done = store.get("de_done",{});
  const isDone = !!(done[level] && done[level][key()]);
  $("doneBtn").className = "btn" + (isDone ? " done" : "");
  $("doneBtn").textContent = isDone ? "✓ 已學會" : "✓ 今天學會了";
  $("streak").textContent = `🔥 連續 ${streak()} 天`;
  postHeight();
}

function streak(){
  const done = (store.get("de_done",{})[level]) || {};
  let n=0; const d=new Date();
  const k = x=>`${x.getFullYear()}-${x.getMonth()+1}-${x.getDate()}`;
  if(!done[k(d)]) d.setDate(d.getDate()-1); // 今天還沒按也不算斷
  while(done[k(d)]){ n++; d.setDate(d.getDate()-1); }
  return n;
}

function speak(rate){
  if(!("speechSynthesis" in window)){ alertBox("此瀏覽器不支援語音"); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(current().e);
  u.lang = "en-US"; u.rate = rate;
  const v = speechSynthesis.getVoices().find(v=>/en[-_]US/i.test(v.lang));
  if(v) u.voice = v;
  speechSynthesis.speak(u);
}
function alertBox(msg){ $("tip").textContent = "⚠️ " + msg; }

function quiz(){
  const s = current(), list = DATA[level];
  const pool = list.filter(x=>x!==s).map(x=>x.w[2]);
  const wrong = [];
  while(wrong.length<2 && pool.length){ wrong.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]); }
  const opts = [s.w[2], ...wrong].sort(()=>Math.random()-.5);
  $("qText").innerHTML = `「<b>${esc(s.w[0])}</b>」是什麼意思？`;
  $("opts").innerHTML = "";
  opts.forEach(o=>{
    const b=document.createElement("button"); b.textContent=o;
    b.onclick=()=>{ b.classList.add(o===s.w[2]?"right":"wrong"); if(o===s.w[2]) b.textContent="✓ "+o; };
    $("opts").appendChild(b);
  });
  $("quiz").classList.add("show");
  postHeight();
}

/* 讓父頁面 iframe 自動調整高度 */
function postHeight(){
  try{ parent.postMessage({type:"daily-english-height", height:document.documentElement.scrollHeight},"*"); }catch(e){}
}

document.querySelectorAll(".levels button").forEach(b=>b.onclick=()=>{
  level = Number(b.dataset.lv); store.set("de_level",level); render();
});
$("speak").onclick=()=>speak(0.95);
$("slow").onclick=()=>speak(0.6);
$("toggleZh").onclick=$("zh").onclick=()=>{
  const h=$("zh").classList.toggle("hidden");
  $("toggleZh").textContent = h ? "顯示中文" : "隱藏中文";
};
$("quizBtn").onclick=quiz;
$("doneBtn").onclick=()=>{
  const done=store.get("de_done",{}); done[level]=done[level]||{};
  if(done[level][key()]) delete done[level][key()]; else done[level][key()]=1;
  store.set("de_done",done); render();
};
$("prev").onclick=()=>{ if(offset>-29){offset--; render(); renderNews();} };
$("next").onclick=()=>{ if(offset<0){offset++; render(); renderNews();} };
window.addEventListener("resize", postHeight);
if("speechSynthesis" in window) speechSynthesis.onvoiceschanged=()=>{};

render();

/* ===== 時事短文：讀取同資料夾的 news.json ===== */
let NEWS = [];
function sayText(text, rate, onend){
  if(!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang="en-US"; u.rate=rate||0.9;
  const v = speechSynthesis.getVoices().find(v=>/en[-_]US/i.test(v.lang)); if(v) u.voice=v;
  if(onend) u.onend=onend;
  speechSynthesis.speak(u);
}
function pickNews(){
  if(!NEWS.length) return null;
  const d=todayDate(), k=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  const exact = NEWS.find(n=>n.date===k);
  if(exact) return {n:exact, review:false};
  const i = ((dayIndex(d)%NEWS.length)+NEWS.length)%NEWS.length;
  return {n:NEWS[i], review:true};
}
function renderNews(){
  const p = pickNews(); if(!p){ $("news").hidden=true; return; }
  const n = p.n; $("news").hidden=false;
  $("nDate").textContent = n.date.replace(/-/g,"/") + (p.review ? "・複習" : "");
  $("nTitle").textContent = n.title;
  $("nTitleZh").textContent = n.titleZh || "";
  $("nBody").innerHTML = n.s.map((x,i)=>`<div class="s" data-i="${i}"><div class="se">${esc(x[0])}</div><div class="sz">${esc(x[1])}</div></div>`).join("");
  $("nSrc").innerHTML = n.url ? `新聞來源：<a href="${esc(n.url)}" target="_blank" rel="noopener">${esc(n.source||n.url)}</a>（短文為改寫教學版）` : "";
  $("nZh").textContent="顯示全部中文";
  postHeight();
}
$("nBody").addEventListener("click", e=>{
  const el = e.target.closest(".s"); if(!el) return;
  const n = pickNews().n, i = +el.dataset.i;
  el.classList.add("open");
  document.querySelectorAll(".s").forEach(x=>x.classList.toggle("playing", x===el));
  sayText(n.s[i][0], 0.85, ()=>el.classList.remove("playing"));
  postHeight();
});
$("nAll").onclick=()=>{
  const n = pickNews().n, els=[...document.querySelectorAll(".s")];
  const play = i=>{
    els.forEach((x,j)=>x.classList.toggle("playing", j===i));
    if(i>=n.s.length) return;
    sayText(n.s[i][0], 0.9, ()=>play(i+1));
  };
  play(0);
};
$("nZh").onclick=()=>{
  const els=[...document.querySelectorAll(".s")], open=!els.every(x=>x.classList.contains("open"));
  els.forEach(x=>x.classList.toggle("open", open));
  $("nZh").textContent = open ? "隱藏全部中文" : "顯示全部中文";
  postHeight();
};
fetch("news.json",{cache:"no-cache"}).then(r=>r.ok?r.json():[]).then(d=>{NEWS=Array.isArray(d)?d:[]; renderNews();}).catch(()=>{});
</script>
